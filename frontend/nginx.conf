# Static file server for the built dashboard. Routing of /api and /ws is done by
# the edge proxy (Caddy) in front of this container.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
